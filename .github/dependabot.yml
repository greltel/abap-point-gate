version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: "0 7 1,11,21 * *"
      timezone: Europe/Athens
    cooldown:
      default-days: 5
    groups:
      abaplint:
        patterns:
          - "@abaplint/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
